   <!-- Contact & Candidate Inquiry Section -->
    <section id="contact" class="py-5 bg-white">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="text-center mb-5">
                        <h2 class="fw-bold mb-3">Candidate & Employer Inquiries</h2>
                        <p class="text-muted">Have a question or looking for tailored recruitment support? Send us a message.</p>
                    </div>
                    <form id="contactForm" class="p-4 p-md-5 border rounded-4 shadow-sm bg-light">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label fw-medium">Full Name</label>
                                <input type="text" class="form-control rounded-3" id="fullName" placeholder="Jane Doe" required>
                            </div>
                            <div class="col-md-6">
                                <label for="emailAddress" class="form-label fw-medium">Email Address</label>
                                <input type="email" class="form-control rounded-3" id="emailAddress" placeholder="jane@example.com" required>
                            </div>
                            <div class="col-12">
                                <label for="inquiryType" class="form-label fw-medium">I am a...</label>
                                <select class="form-select rounded-3" id="inquiryType">
                                    <option selected>Job Seeker / Candidate</option>
                                    <option>Hiring Manager / Employer</option>
                                    <option>General Inquiry</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="messageBox" class="form-label fw-medium">Message</label>
                                <textarea class="form-control rounded-3" id="messageBox" rows="4" placeholder="Tell us about your background or staffing needs..." required></textarea>
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
